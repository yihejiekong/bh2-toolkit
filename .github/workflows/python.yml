name: python

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    name: py${{ matrix.python }} · compile
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # 解包依赖里的 UnityPy 需要编译 etcpak / astc 等 C++ 扩展，
      # 在 CI 上装不稳；这一层只做语法与纯标准库检查，装依赖仅作参考。
      - name: Install deps (non-blocking)
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Byte-compile everything
        run: python -m compileall -q unpack cards bot

      - name: Stdlib-only smoke test
        run: |
          cd cards
          python -c "import paths as P; print('tables:', P.TABLES); print('materials:', P.MATERIALS)"

      - name: Check no secrets committed
        run: |
          ! grep -rInE "sk-[A-Za-z0-9]{20,}|SESSDATA=[^;\"]{6,}|login_hex\"\s*:\s*\"[0-9a-f]{40,}" \
            --include="*.py" --include="*.json" --include="*.md" --include="*.example" . \
            | grep -v "^./.github/" || (echo "发现疑似凭据，请检查" && exit 1)
